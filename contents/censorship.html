<h1 style="text-align: center;">登録した文字でういビーム検閲を実施する</h1>
<div class="bar"></div>
<p style="font-weight: bold; text-align: left; margin-bottom: -2px;">検閲する文章を入力</p>

<textarea 
    rows="10" 
    cols="100"
    id="CensorshipTextInputField"
    style="padding:10px; width: 95%; margin-bottom: 10px; border-radius: 5px; box-sizing: border-box;  margin-right: 2.5%; margin-left: 2.5%;"
></textarea>
<div style="display: flex; width: 95%; height: auto; align-items: center; justify-content: center; margin-top: 10px;">
    <button 
        id="submitButton"
        class="executeButton"
        onclick='execCensorship("CensorshipTextInputField","censorship-censored-grid","Registered");'
    >検閲を実施</button>
</div>

<p style="font-weight: bold; font-size: large; margin-bottom: -2px;">検閲結果</p>
<div style="max-width: 95%; overflow-x: auto; margin-bottom: 10px;"> 
    <div id="censorship-censored-grid"><li style="margin-left: 2.5%;"><span>検閲結果が出力されます</span></li></div>
</div>

<div class="bar"></div>
<p style="font-weight: bold; font-size: large; margin-bottom: -4px;">検閲対象の文字一覧</p>
<div style="width:95%; margin-bottom: 10px; margin-right: 2.5%; margin-left: 2.5%;">
    <censorship-targets-table data-target="Registered"></censorship-targets-table>
</div>
