
<h1 style="text-align: center;">ういビーム検閲を試す</h1>
<div class="bar"></div>
<p style="font-weight: bold; text-align: left; margin-bottom: -2px;">検閲対象文字(サンプルのみ)</p>
<div  style="width:95%; margin-bottom: 10px; margin-right: 2.5%; margin-left: 2.5%;">
    <censorship-targets-table data-target="Sample"></censorship-targets-table>
</div>

<p style="font-weight: bold; text-align: left; margin-bottom: -2px;">検閲する文章を入力</p>
<textarea 
    id="SampleTextInputField"
    style="padding:10px; width: 95%; margin-bottom: 10px; border-radius: 5px; box-sizing: border-box;  margin-right: 2.5%; margin-left: 2.5%;"
    rows="10"
></textarea>
<div style="display: flex; width: 95%; height: auto; align-items: center; justify-content: center; margin-top: 10px;">
    <button 
        id="submitButton"
        class="executeButton"
        onclick='execCensorship("SampleTextInputField","home-censored-grid","Sample");'
        style = "margin-bottom: 10px;"
    >検閲を実施</button>
</div>

<div style="max-width: 95%; overflow-x: auto;  margin-right: 2.5%; margin-left: 2.5%;"> 
    <div id="home-censored-grid"></div>
</div>

<div id="beam-on-first-time" class="beam-container">
    <div class="beambg"></div>
    <div class="beameffect" style="transform: rotate(70deg)"></div>
    <div class="beameffect" style="transform: rotate(-70deg)"></div>
    <div class="beam"></div>
</div>
